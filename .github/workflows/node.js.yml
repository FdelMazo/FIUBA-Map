name: Build & Deploy to Github Pages

on:
  push:
    branches: [main]

jobs:
  node-to-gh:
    runs-on: ubuntu-latest
    name: Build & Deploy to Github Pages
    steps:
      - uses: actions/checkout@v4
      - id: validate-data
        run: node scripts/validate-data.mjs
      - id: node-to-gh
        uses: fdelmazo/node-to-gh-action@v2
      - id: typescript-check
        run: npx tsc --noEmit
